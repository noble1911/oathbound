<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1014" />
    <title>Oathbound</title>
    <meta name="description" content="1v1 fantasy army auto-battler: pick a Lord, deploy squads, claim ARPG loot, and break the enemy Keep." />
    <!-- link previews: crawlers need absolute URLs (everything the game itself loads stays relative) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oathbound" />
    <meta property="og:title" content="Oathbound: raise your banners, break their Keep" />
    <meta property="og:description" content="A 1v1 fantasy army auto-battler in your browser. Pick a Lord, deploy squads, gear them with ARPG loot, and march on the enemy Keep. Play a friend or the AI." />
    <meta property="og:url" content="https://games.noblehaus.uk/oathbound/" />
    <meta property="og:image" content="https://games.noblehaus.uk/oathbound/ui/keyart.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1081" />
    <meta property="og:image:alt" content="Two armies clash at a river bridge beneath their Keeps" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oathbound: raise your banners, break their Keep" />
    <meta name="twitter:description" content="A 1v1 fantasy army auto-battler in your browser. Play a friend or the AI." />
    <meta name="twitter:image" content="https://games.noblehaus.uk/oathbound/ui/keyart.webp" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23151920'/%3E%3Cpath d='M20 10v44M20 12h26l-7 9 7 9H20' stroke='%23b8c2ce' stroke-width='5' fill='%233b6fd8' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preload" as="font" type="font/woff2" href="./ui/fonts/grenze-gotisch.woff2" crossorigin />
    <link rel="preload" as="image" href="./ui/keyart.webp" type="image/webp" />
    <style>
      /* the boot veil: shown by the HTML alone, before any script or stylesheet has arrived */
      @font-face { font-family: 'Grenze Gotisch'; font-weight: 600; font-display: swap; src: url('./ui/fonts/grenze-gotisch.woff2') format('woff2'); }
      html, body { margin: 0; height: 100%; background: #0d1014; }
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-content: center; justify-items: center; gap: 18px; background: #0d1014; color: #f1e7cf; font-family: 'Grenze Gotisch', 'Palatino Linotype', Georgia, serif; transition: opacity 0.5s ease; }
      body.booted #boot { opacity: 0; pointer-events: none; }
      #boot b { font-size: clamp(34px, 6vw, 76px); font-weight: 600; letter-spacing: 0.01em; }
      #boot .boot-bar { width: min(320px, 60vw); height: 4px; background: #1d232c; overflow: hidden; box-shadow: 0 0 0 1px #56616f; }
      #boot .boot-bar i { display: block; height: 100%; width: 8%; background: #e8ebef; transition: width 0.35s ease-out; }
      #boot .boot-text { font: italic 14px system-ui, 'Segoe UI', sans-serif; color: #b8c2ce; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <b>Oathbound</b>
      <div class="boot-bar"><i></i></div>
      <span class="boot-text">Mustering the host</span>
    </div>
    <noscript><p style="position: fixed; inset: auto 0 12% 0; z-index: 201; text-align: center; color: #e8ebef; font-family: system-ui, sans-serif">Oathbound needs JavaScript to run.</p></noscript>
    <script>
      // the first real milestone: the document has parsed and the bundle is on its way
      document.querySelector('#boot .boot-bar i').style.width = '20%';
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

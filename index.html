    <meta property="og:image:width" content="1920" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314111a'/%3E%3Cpath d='M20 10v44M20 12h26l-7 9 7 9H20' stroke='%23d9b45a' stroke-width='5' fill='%23a33' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="./ui/keyart.webp" type="image/webp" />
    <style>
      /* the boot veil: shown by the HTML alone, before any script or stylesheet has arrived */
      html, body { margin: 0; height: 100%; background: #0d0b10; }
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(ellipse at 50% 40%, #1b1620, #08070a 70%); color: #d9b45a; font-family: Cinzel, 'Trajan Pro', 'Palatino Linotype', Georgia, serif; transition: opacity 0.5s ease; }
      body.booted #boot { opacity: 0; pointer-events: none; }
      #boot b { font-size: clamp(28px, 5vw, 64px); font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; background: linear-gradient(180deg, #fff6d6, #f0cf7e 40%, #a7782a 65%, #e9c472); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #boot .boot-bar { width: min(320px, 60vw); height: 4px; border-radius: 2px; background: #241d16; overflow: hidden; box-shadow: 0 0 0 1px #3a2f22; }
      #boot .boot-bar i { display: block; height: 100%; width: 8%; background: linear-gradient(90deg, #a7782a, #f6dc94); box-shadow: 0 0 10px #d9b45a; transition: width 0.35s ease-out; }
      #boot .boot-text { font: italic 14px Georgia, serif; color: #958a7d; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <b>Oathbound</b>
      <div class="boot-bar"><i></i></div>
      <span class="boot-text">Mustering the host</span>
    </div>
    <noscript><p style="position: fixed; inset: auto 0 12% 0; z-index: 201; text-align: center; color: #e6dccb; font-family: Georgia, serif">Oathbound needs JavaScript to run.</p></noscript>
    <script>
      // the first real milestone: the document has parsed and the bundle is on its way
      document.querySelector('#boot .boot-bar i').style.width = '20%';
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
